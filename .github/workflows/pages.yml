name: Website

# Trunk bundles the WASM assets; crates/site-gen renders the five pages before publication, with the
# download sizes read from the latest release. Requires Settings → Pages → Source: GitHub Actions.

on:
  # Only when the site is built from what changed: its pages and code, the board the demo writes with and
  # its strokes, the demo's recordings, and the version it shows.
  push:
    branches: [main]
    paths: &paths
      - 'landing/**'
      - 'crates/site/**'
      - 'crates/site-gen/**'
      - 'crates/demo/**'
      - 'crates/board/**'
      - 'assets/glyphs/**'
      - 'assets/demos/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'
      - '!**/README.md'
  # Pull requests only build it, so a broken site never reaches main.
  pull_request:
    paths: *paths
  workflow_dispatch:
  # A new release changes the download sizes. Release publishes with GITHUB_TOKEN, which starts no
  # `release` event, so the site follows the workflow instead.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Trunk fetches the wasm-bindgen that matches Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build the website
        working-directory: landing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The published page never goes out without its download sizes.
          ALCYO_REQUIRE_RELEASE: '1'
        # The demo is a page of its own under demo/, built after the site, which empties dist/ first.
        run: |
          cargo test --locked -p alcyo-site-gen
          trunk build --release
          trunk build demo/index.html --dist dist/demo --release
      - uses: actions/upload-pages-artifact@v4
        with:
          path: landing/dist
      # The same files for Cloudflare Pages, which takes a folder rather than GitHub's tarball.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: landing/dist
          retention-days: 3

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Cloudflare Pages gets the same build: main goes to production, a pull request from this repository to a
  # preview of its own (forks get no secrets, so they are skipped). The project is made on the first run.
  cloudflare:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Make the project if it is not there yet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project list | grep -qw alcyo ||
            npx --yes wrangler@4 pages project create alcyo --production-branch=main
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=alcyo --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
