[package]
name = "mistralrs-ios-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Not part of Alcyo's workspace: a check of whether mistral.rs builds for, and runs on, the iPad (#41).
[workspace]

[dependencies]
anyhow = "1"
mistralrs = { version = "0.8.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
metal = ["mistralrs/metal"]

# sysinfo 0.36.1, which mistral.rs pins, uses libc items that exist only for the Mac on the iPad too; this copy
# keeps them to the Mac (vendor/sysinfo, marked "Alcyo spike").
[patch.crates-io]
sysinfo = { path = "vendor/sysinfo" }
